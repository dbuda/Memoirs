[project]
name = "memoirs"
version = "0.1.0"
description = "Evidence-linked information extraction demo for memoir interviews"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "celery[redis]>=5.4,<6.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.7,<1.0",
]

[project.scripts]
memoirs-eval = "app.evaluation:main"
memoirs-seed = "app.seed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
